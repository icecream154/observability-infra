# 1. 文件职责、加载方式与执行位置
# -----------------------------------------------------------------------------
# 这是当前 ClickStack Collector 的自定义配置片段，用于调整已有处理器的参数。
# compose.yaml 将本文件只读挂载到容器内 /etc/otelcol-contrib/custom.yaml，
# 再通过 CUSTOM_OTELCOL_CONFIG_FILE 告诉镜像去加载它。
# 当前使用 hyperdx/hyperdx-otel-collector:2.43.1，并通过 OpAMP 从 app 获取远程配置；
# 最终配置由“镜像内置配置 + 本文件 + OpAMP 下发配置”共同组成。
# 本文件只修改 memory_limiter 和 batch，保留其他内置处理、接收器、认证和导出配置。
#
# Collector 的数据处理结构是：
#   receivers（接收） -> processors（处理） -> exporters（导出到 ClickHouse）。
# processors 下的映射仅定义处理器实例，不自动启用，也不靠这里的书写顺序决定执行顺序。
# 是否启用及先后顺序由 service.pipelines.<管道>.processors 列表决定。
# 当前镜像的内置管道已经引用了相同名字，因此这里能调整对应实例的参数：
#   traces / metrics：memory_limiter -> batch；
#   默认日志管道：memory_limiter -> transform -> batch。
# transform 是镜像内置的日志转换处理器，本文件没有修改它。
# 先进行内存保护，再转换和积累批次，可以尽早向上游反馈内存压力。
#
# 本文件没有单独声明 receivers、exporters 和完整的 service.pipelines，
# 不能直接当作普通 OpenTelemetry Collector 的完整配置独立启动。
# 它也没有声明读取电脑业务日志目录的 filelog 接收器；业务数据仍需由 SDK 或客户端采集器发送。
processors:
  # 2. memory_limiter：内存保护与背压
  # ---------------------------------------------------------------------------
  # 目的：在内存压力过大时暂时拒收更多数据，给现有处理、导出和内存回收留出时间，降低 OOM 风险。
  # “背压”是把暂时处理不了的状态向前传递，使接收器、客户端有机会减速或重试。
  # 它会向调用它的上游组件返回可重试错误；具体如何重试、能重试多久，由上游实现和配置决定。
  # 如果上游不重试、重试期限耗尽，或者缓冲已满，仍可能丢失数据。
  # 本处理器不会自动把拒收的数据保存到磁盘，也不是持久消息队列。
  #
  # 当前容器限额为 1 GiB = 1024 MiB，以下参数形成三层需要区分的数值：
  #   640 MiB：软阈值 = limit_mib - spike_limit_mib = 768 - 128；
  #   768 MiB：限制器的硬阈值；
  #  1024 MiB：Compose 为整个容器设置的内存上限。
  #
  # 当前组件版本观察的是 Collector 进程的 Go 堆内存（runtime.MemStats.Alloc）。
  # Collector 的栈、原生分配、其他运行开销，以及独立 Supervisor 进程等，
  # 不应直接等同于这个堆内存数值；docker stats 看到的容器内存也不一定与它相同。
  # 此阈值面向 Collector 进程整体的堆使用，不是日志、Trace、指标各自获配 768 MiB。
  #
  # memory_limiter 的“硬阈值”表示需要进一步采取内存回收动作，
  # 不是操作系统强制封顶；它不能保证内存绝不会超过 768 MiB，更不能替代容器限额。
  # 768 与 1024 之间留下的空间用于容纳额外开销，但不能据此保证任何流量下都不会 OOM。
  # 调整 compose.yaml/.env 中的 COLLECTOR_MEMORY_LIMIT 时，应一起核对本段和批处理参数。
  # 本文件采用固定数值，不会随容器限额变化而自动调整；它也不限制 ClickHouse 或磁盘容量。
  memory_limiter:
    # 周期性测量内存的间隔：每 1 秒检查一次。
    # 这不是每秒只接收一次数据，也不是每条记录都等待 1 秒；正常数据处理可以持续进行。
    # 两次测量之间仍可能发生突发分配，所以需要下面的 spike_limit_mib 提前留出余量。
    # 缩短间隔可以更早发现内存上涨，也会增加检查开销；仅靠检查频率不能消除大消息造成的突增。
    check_interval: 1s

    # 限制器硬阈值，单位 MiB；1 MiB = 1024 × 1024 字节。
    # 本配置达到约 640 MiB 的软阈值后就会进入限制状态，拒收更多数据并向上游返回可重试错误。
    # 达到 768 MiB 硬阈值时会进一步尝试强制垃圾回收（GC），回收已不可达的 Go 对象。
    # 软限制阶段也可能按组件策略触发 GC，不能理解成“只有达到硬阈值才回收”。
    # 仍被批次或导出队列引用的数据不会因为 GC 就消失；下游持续阻塞时，回收效果可能有限。
    # 观测内存回到软阈值以下后，可以恢复接收。
    limit_mib: 768

    # 两次检查之间预计可能增长的内存余量，单位同样为 MiB。
    # 它决定“提前多久开始限制”：软阈值 = 768 - 128 = 640 MiB。
    # 它不是在 768 MiB 之外额外分配 128 MiB；不是将硬阈值变成 896 MiB；也不预先占用内存。
    # 在 limit_mib 不变时，增大此值会降低软阈值，更早施加背压；减小则会缩小突发余量。
    # 应保持小于 limit_mib，并结合检查间隔、消息大小和流量突发程度一起评估。
    # 128 MiB 只是配置假设，实际突发仍可能超过它。
    spike_limit_mib: 128

  # 3. batch：将记录积累成批次，再交给后续导出器
  # ---------------------------------------------------------------------------
  # 目的：减少零碎的导出调用，改善网络传输和 ClickHouse 批量写入的效率。
  # 代价：尚未发送的数据暂存在内存，批次过大可能增加内存占用；等待成批也会增加一些处理延迟。
  # 此处的“发送”指批处理器将数据交给下游，不等同于已经成功写入 ClickHouse。
  # 后续导出器仍可能排队、重试、按不同表组织写入；实际落库时间取决于整条链路。
  #
  # “条数”随数据类型分别计量：
  #   logs：LogRecord（日志记录）数量；
  #   traces：Span 数量，不是完整 Trace 数量，一个 Trace 可以包含许多 Span；
  #   metrics：指标数据点数量，不是指标名称数量，一个指标可以有多个数据点。
  # 不同信号在各自管道中批处理，不把日志、Span 和指标混成一个全局的 1000 条批次。
  # 这些数值不按字节数、HTTP 请求数或业务请求数计算；同样 1000 条数据的体积可能差很多。
  batch:
    # 定时发送间隔：定时触发时，即使尚未累计到 1000 条，也会发送已有的非空批次。
    # 适合低流量场景，避免只有少量记录时一直等待数量阈值。
    # 高流量达到数量阈值可以提前发送，不要求每个批次都先等待满 5 秒。
    # 这里不是网络请求超时，也不是“每条数据产生后 5 秒内必定落库”的承诺；
    # 上游缓冲、调度、下游排队、重试和数据库写入耗时都可能增加端到端延迟。
    timeout: 5s

    # 按数量触发发送的阈值：累计达到 1000 个记录/数据点时，不必等待定时触发。
    # 1000 是触发条件，不是严格的单批上限，也不意味着不足 1000 条就丢弃。
    # 例如一次收到 1500 条且此前无积压时，可以直接发送 1500 条，而不必固定拆成 1000 和 500。
    # 更严格的单批条数控制由下一项 send_batch_max_size 提供。
    send_batch_size: 1000

    # 单次交给下游的批次条数上限；较大的积累会拆分，每批最多 2000 个记录/数据点。
    # 必须大于或等于 send_batch_size；这里满足 2000 >= 1000。
    # 拆分后不足触发阈值的余量可能继续等待定时发送，不保证同一时刻全部排空。
    # 2000 条仍不是字节数限制：大正文、很多属性、复杂指标会使批次占用更多内存和带宽。
    # 增大批次不等于一定更快，需要同时考虑内存额度、消息大小和下游写入能力。
    send_batch_max_size: 2000

# 4. 可靠性与后续修改
# -----------------------------------------------------------------------------
# memory_limiter 负责内存压力控制，batch 负责批量传递；二者都不提供磁盘持久化和断电恢复能力。
# 当前没有在本文件或 Compose 中增加持久发送队列；进程退出、持续故障或重试耗尽时仍可能丢数据。
# 调整参数时，应同时观察真实负载下的内存峰值、拒收/丢弃情况、导出错误及数据到达延迟。
# 只修改注释不会改变运行行为，无需为本次注释更新重启服务。
# 以后修改实际参数，可正常重启 collector 让其重新加载挂载文件；
# 如果同时修改 .env 或 Compose 的容器环境/资源配置，应使用 Compose 更新容器配置。
#
# 参考：当前 2.43.1 构建配置采用的 OpenTelemetry Collector v0.155.0 组件说明。
# memory_limiter：https://github.com/open-telemetry/opentelemetry-collector/blob/v0.155.0/processor/memorylimiterprocessor/README.md
# batch：https://github.com/open-telemetry/opentelemetry-collector/blob/v0.155.0/processor/batchprocessor/README.md
